---
# ACL credential for the admin consumer.
# Group "admin" is allowed by both admin-acl (/payments, /grc) and anyone-acl (/retail-banking).
apiVersion: v1
kind: Secret
metadata:
  name: admin-acl
  namespace: global-api-gateway-ns
  labels:
    konghq.com/credential: acl
type: Opaque
stringData:
  kongCredType: acl
  group: admin
---
# ACL credential for the user consumer.
# Group "user" is allowed only by anyone-acl (/retail-banking).
# Requests to /payments and /grc return 403.
apiVersion: v1
kind: Secret
metadata:
  name: user-acl
  namespace: global-api-gateway-ns
  labels:
    konghq.com/credential: acl
type: Opaque
stringData:
  kongCredType: acl
  group: user
