---
# JWT credential for the admin consumer.
# key must match the Keycloak client_id ("admin-client") — Kong uses this to identify the consumer
# from the JWT's azp/iss claim.
# Replace REALM_PUBLIC_KEY with the base64-encoded RSA public key from:
#   GET /realms/<realm>/protocol/openid-connect/certs
# or via setup-keycloak.sh which fetches it automatically.
apiVersion: v1
kind: Secret
metadata:
  name: admin-jwt
  namespace: global-api-gateway-ns
  labels:
    konghq.com/credential: jwt
type: Opaque
stringData:
  kongCredType: jwt
  key: admin-client
  algorithm: RS256
  rsa_public_key: |
    -----BEGIN PUBLIC KEY-----
    MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA7MSwR7A8IHpIWWJg2yKp
    47BllWcgtVKEasFMczoPckngHUa5NSxbGNJJ90UCEVjZ8G9B92shWadVHYSxzDvP
    zj+HpQM2ZlLLtIBeL+V5Zi0nuqmTqc+SqpETLybefjI2oCILWEKWuE46NCt7SBJx
    5zkDrX8PYXbkCTpmI7VpRcsZQ1pkkFlvmJsSagKfRd+fGcjCClSprLKJyVf+02TO
    QLc3IlLwXYNq+NKQbGOSo9K3+eR7u0WSC6KYzQRsNGXVedg5IoN6uR9EmiaTFWLx
    wbYVIixFOYUn5+Xl+4dD/OYwUrmbhpuzTIfWyfIvIloFx30Wp2UzCMiSOSUJlV7P
    HQIDAQAB
    -----END PUBLIC KEY-----
