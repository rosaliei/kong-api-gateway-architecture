# ACL credential secrets — referenced by KongConsumers in 5-consumers.yaml.
# Kong reads the konghq.com/credential=acl label to discover these as ACL creds.
# The "group" field is what the ACL plugin (2-kong-plugins.yaml) matches against
# in its "allow" list to permit or deny a request.
#
# Group membership:
#   admin  →  allowed by both admin-acl plugin (/payments, /grc) and anyone-acl plugin (/retail-banking)
#   user   →  allowed only by anyone-acl plugin (/retail-banking); denied on /payments and /grc (403)
---
apiVersion: v1
kind: Secret
metadata:
  name: admin-acl
  namespace: global-api-gateway-ns
  labels:
    konghq.com/credential: acl  # tells Kong this secret is an ACL credential
type: Opaque
stringData:
  kongCredType: acl
  group: admin  # matches KongPlugin admin-acl (allow: [admin]) and anyone-acl (allow: [admin, user])
---
apiVersion: v1
kind: Secret
metadata:
  name: user-acl
  namespace: global-api-gateway-ns
  labels:
    konghq.com/credential: acl  # tells Kong this secret is an ACL credential
type: Opaque
stringData:
  kongCredType: acl
  group: user  # matches KongPlugin anyone-acl only (allow: [admin, user]); blocked by admin-acl
